name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed Python dependencies
        run: python -m pip check

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify committed frontend artifacts are synchronized
        run: |
          git diff --exit-code -- package-lock.json static/dist
          git status --porcelain -- package-lock.json static/dist | tee /tmp/frontend-status.txt
          test ! -s /tmp/frontend-status.txt

      - name: Reject critical runtime CDN and inline-script regressions
        run: npm run check:runtime-deps

      - name: Run Django system checks
        run: python manage.py check

      - name: Check production security settings
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-security-check-only-long-random-looking-secret-2026-not-a-real-secret"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: ci-production-webhook-check-secret
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect production static files without special ignores
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-staticfiles-only-long-random-looking-secret-2026-not-a-real-secret"
          DJANGO_ALLOWED_HOSTS: makolo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://makolo.example.test
          MAKOLO_PUBLIC_BASE_URL: https://makolo.example.test
          PAYMENTS_WEBHOOK_SECRET: ci-production-webhook-check-secret
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: |
          rm -rf staticfiles
          python manage.py collectstatic --noinput

      - name: Validate WhiteNoise manifest
        run: python scripts/validate_static_manifest.py

      - name: Run tests
        run: python manage.py test

  postgresql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makolo_ci
          POSTGRES_USER: makolo
          POSTGRES_PASSWORD: makolo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makolo -d makolo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-postgresql-only-secret-key-not-used-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: makolo_ci
      DJANGO_DATABASE_USER: makolo
      DJANGO_DATABASE_PASSWORD: makolo-ci-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run PostgreSQL Django checks
        run: python manage.py check

      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run contextual authority, Groups, geography and Activities PostgreSQL tests
        run: >-
          python manage.py test
          authorization.tests
          authorization.test_group_scope
          authorization.test_activity_scope
          organizations.tests
          groups.tests
          groups.test_identity_security
          groups.test_account_continuity
          geography.tests
          activities.tests
          events.test_activity_bridge

      - name: Run Journey, Request and Access PostgreSQL tests
        run: >-
          python manage.py test
          authorization.test_journey_access_scope
          journeys.tests
          access.tests
          access.test_concurrency
          tickets.test_journey_access_backfill
          tickets.test_journey_access_bridge
          scanner.test_access_bridge

      - name: Run Commerce and Capacity PostgreSQL tests
        run: >-
          python manage.py test
          capacity.tests
          capacity.test_access_bridge
          capacity.test_concurrency
          commerce.tests
          tickets.test_commerce_capacity_bridge
          tickets.test_commerce_capacity_backfill
          tickets.test_commerce_capacity_concurrency
          payments.test_commerce_bridge
          payments.test_generic_commerce

      - name: Run Domain Events, Notifications and Automation PostgreSQL tests
        run: >-
          python manage.py test
          core.test_domain_events
          core.test_domain_event_concurrency
          notifications.test_domain_events
          automation.test_domain_events
          automation.test_domain_event_concurrency

      - name: Run CRM, audiences and promotions PostgreSQL tests
        run: >-
          python manage.py test
          crm.test_canonical_crm
          crm.test_audiences
          promotions.test_commerce_promotions
          promotions.test_concurrency

      - name: Run Scanner, Operations and Analytics canonical PostgreSQL tests
        run: >-
          python manage.py test
          scanner.test_canonical_scope
          operations.test_canonical_scope
          analytics_app.test_canonical_metrics

      - name: Run operational readiness PostgreSQL tests
        run: >-
          python manage.py test
          core.test_operational_readiness
          accounts.test_operational_hardening
          events.test_operational_hardening

      - name: Run payment PostgreSQL tests
        run: >-
          python manage.py test
          payments.test_operational_hardening
          payments.tests

      - name: Run ticket and scanner PostgreSQL tests
        run: >-
          python manage.py test
          scanner.tests
          tickets.test_security

      - name: Run automation PostgreSQL tests
        run: >-
          python manage.py test
          automation.test_operational_hardening
          automation.tests

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_ENV: e2e
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: makolo-e2e-only-secret-key-never-production-2026
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DB_PATH: /tmp/makolo-e2e.sqlite3
      DJANGO_EMAIL_FILE_PATH: /tmp/makolo-e2e-emails
      MAKOLO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      PAYMENTS_SANDBOX_ENABLED: "True"
      PAYMENTS_WEBHOOK_SECRET: makolo-e2e-webhook-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Verify committed frontend artifacts are synchronized
        run: |
          git diff --exit-code -- package-lock.json static/dist
          git status --porcelain -- package-lock.json static/dist | tee /tmp/frontend-status.txt
          test ! -s /tmp/frontend-status.txt

      - name: Reject critical runtime CDN and inline-script regressions
        run: npm run check:runtime-deps

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Install Playwright browsers
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          npx playwright install --with-deps chromium firefox

      - name: Prepare deterministic E2E environment
        run: bash scripts/prepare-e2e.sh

      - name: Run end-to-end product validation
        env:
          E2E_SKIP_PREP: "1"
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: |
            playwright-report
            test-results/playwright
            /tmp/makolo-e2e-server.log
          if-no-files-found: ignore
          retention-days: 5
